name: Cloud-Abgabe

# 26.11.2026: Cloud-Routinen liefern ihre Arbeit als Code-Zweig plus Zweig `prtext/<auftrag>` (pr.md, bericht.md). Dieser Lauf legt daraus
# den PR an (oder hängt den Bericht als Nachtrag an den offenen PR) und setzt das Label `stufe-0|1|2`; der Dirigent holt nichts mehr von Hand.
# Logik: tools/cloud-abgabe.mjs (Skript aus main, `ref: main`). Der prtext-Zweig wird nie ausgecheckt, nur über die Contents-API als Text gelesen;
# der Zweigname kommt nur über `env`, nie in `run:`.
#
# Auslöser: GitHub nimmt bei `push` die Workflow-Datei aus dem gepushten Commit. Der Zweig `prtext/<auftrag>` muss deshalb von origin/main
# abzweigen (kein Orphan-Zweig: ohne diese Datei startet nichts). Ein Orphan-Zweig oder ein verpasster Lauf: `workflow_dispatch` mit `zweig`.
#
# App-Token (wie bestand-bauen.yml): ein mit GITHUB_TOKEN angelegter PR startet keine Workflows, die PR-Prüfkette bliebe aus. Rechte nur
# pull-requests/issues schreiben, contents lesen: kein Merge (der braucht contents: write). Der Vorprüf-Schritt tools/pr-vorpruefung.mjs
# braucht den Diff des Fremdzweigs im Arbeitsbaum und entfällt hier; die Cloud-Routine fährt ihn vor dem Push, die PR-Kette prüft danach.

on:
  push:
    branches: ['prtext/**']
  workflow_dispatch:
    inputs:
      zweig:
        description: 'Zweig prtext/<auftrag>, der abgegeben werden soll'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-abgabe-${{ github.event.inputs.zweig || github.ref }}
  cancel-in-progress: false

jobs:
  abgeben:
    name: PR anlegen und Bericht anhängen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: App-Token holen
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DATEN_APP_ID }}
          private-key: ${{ secrets.DATEN_APP_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Abgabe verarbeiten
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ZWEIG: ${{ github.event.inputs.zweig || github.ref_name }}
        run: node tools/cloud-abgabe.mjs "$ZWEIG"
