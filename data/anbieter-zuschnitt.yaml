# `pipeline/bau/anbieter-zuschnitt.ts` setzt `anbieterStaffel` nur, wenn Folgen davor und Summe der Glieder genau aufgehen; sonst Warnung.
# Nicht hier, mit Grund: `ABWEICHUNGEN_ERLAUBT` in `pipeline/check-anbieter-zuschnitt-bestand.ts`.

