# Deutsche Staffeln von Pokémon Horizonte (AniList 158871 „Pokémon (2023)“) in der eigenen Zählung der Serie (Auftrag Dirigent, 20.11.2026).
#
# Warum: Horizonte ist eine eigene Serie der Reihe Pokémon (`eigenesWerk`, zählt nicht als Staffel 26 ff. der Hauptserie in
# `pokemon-staffeln.yaml`), AniList führt sie aber als einen Eintrag. Wirkung wie dort (`pipeline/lib/pokemon-staffeln.ts`): die Detaildatei
# `public/data/folgen/158871.json` trägt `s: [[Staffel, von, bis], …]` (offene Staffel `[Staffel, von]`) und `sn` (Staffelnamen), `franchises.json`
# `staffelQuelle` 1 und `staffelBis` (letzte Staffel); `folgen/zaehlung.json` zählt bis zur letzten belegten Folge (`zaehleFolgen`). TV-Termine
# bekommen `staffelFolge` nur über den Folgentitel der Wikipedia-Liste (`pipeline/bau/staffel-folge-tv.ts`).
#
# Zählung: von/bis sind die durchlaufenden Folgennummern des Titels — dieselben wie aniSearch (japanische Zählung), die RTL+-Folgenbereiche
# (`dubRanges` 1–136) und der Termin `pokemon-horizonte-s4-rtlplus` (firstEpisodeNumber 137, `streaming-nachtrag-2026.yaml`).
#
# Quellen, gelesen 20.11.2026 (beide zählen Staffel 1: 45, Staffel 2: 44, Staffel 3: 47 Folgen):
# - de.wikipedia „Pokémon (Anime)/Horizonte“ (`data/wikipedia-folgen.json`, geholt 2026-11-20T04:09Z): Spalte „Folge in der Staffel“ beginnt
#   bei Gesamtfolge 1280 („Willkommen an der Orangen-Akademie!“, DE 21.02.2025), 1324 („Erneuter Kurs auf Abenteuer (Teil 1)“, DE 02.01.2026)
#   und 1371 („Eine Welt voller Abenteuer“) neu; Staffel 3 endet mit „Stellares Finale“ (DE 13.11.2026). Staffel 4 führt dort 23 Zeilen,
#   ab Zeile 4 ohne deutschen Titel — ein Ende der Staffel nennt die Seite nicht.
#   https://de.wikipedia.org/wiki/Pok%C3%A9mon_(Anime)/Horizonte
# - TOGGO-Folgenliste der Serie VSE292 (`data/toggo.json`, geholt 2026-11-20T04:08Z): Staffel 1 Folgen 1–45, Staffel 2 1–44, Staffel 3 1–47,
#   Staffel 4 bisher Folge 1 (ab 27.11.2026), jede Liste lückenlos. https://www.toggo.de/pokemon/serien/pokemon-horizonte-die-serie-vse292
# - Dieselben Grenzen in Japan (aniSearch 17947, `data/anisearch-folgen.json`, geholt 2026-09-01): nach Folge 45 (29.03.2024) und nach
#   Folge 89 (21.03.2025) je eine Sendepause; die Titel 45/46 und 89/90 sind dieselben wie bei Wikipedia. https://www.anisearch.de/anime/17947
# - Staffel 4 Folge 1 = Folge 137: RTL+ „Eine Welt voller Abenteuer“, verfügbar ab 20.11.2026
#   (https://plus.rtl.de/pokemon-horizonte-die-serie-p_10142/video/eine-welt-voller-abenteuer-c_2211265).
#
# Staffelnamen (`name`; Daniel 22.11.2026: „wir folgen offiziellen staffel bezeichnern“). Offizielles Muster „Pokémon Horizonte: Staffel N – Name“,
# Staffel 1 heißt „Pokémon Horizonte: Die Serie“. Belege, gelesen 23.11.2026 (Dirigent per Tavily; die Cloud erreicht diese Seiten evtl. nicht):
# - PokéWiki https://www.pokewiki.de/Pok%C3%A9mon_Horizonte:_Die_Serie : „Staffel 1: Pokémon Horizonte: Die Serie … Staffel 2: Pokémon Horizonte: Die Suche
#   nach Laqua … Staffel 3: Pokémon Horizonte: Gute Aussichten … Staffel 4: Pokémon Horizonte: Wunder in Sicht“
# - PokéWiki https://www.pokewiki.de/Staffel_4_(Pok%C3%A9mon_Horizonte) : „Pokémon Horizonte: Staffel 4 – Wunder in Sicht (engl. Pokémon Horizons: Season 4—Wonders Ahead)“
# - offiziell https://pokemongo.com/de/news/pokemon-horizons-celebration-event-2026 : „Pokémon Horizonte: Staffel 3 – Gute Aussichten ist jetzt bei TOGGO verfügbar.“
# - Netflix https://www.netflix.com/de/title/81944585 : „Pokémon Horizons: Season 2: The Search for Laqua“; Netflix 81696980 = „Pokémon Horizonte: Die Serie“ (Staffel 1).
# - Staffel 3 zusätzlich: TOGGO-Programm KW 42/2026 (anime2you, https://www.anime2you.de/news/1060030/anime-tv-programm-42-2026/, gelesen 12.10.2026).
#   Staffel 4 ist `offen`: ihr Ende nennt keine Quelle, darum kein bis/folgen.
# Wächter: `pipeline/check-horizonte-staffeln.ts` (check:logic), `pipeline/check-horizonte-staffeln-bestand.ts` (gegen Wikipedia und TOGGO).
quelle: https://de.wikipedia.org/wiki/Pok%C3%A9mon_(Anime)/Horizonte
abgerufen: '2026-11-20'  # data/wikipedia-folgen.json und data/toggo.json (geholtAm)
gelesen: '2026-11-20'
titel:
- anilistId: 158871
  titel: "Pokémon Horizonte"
  # Ein Titel, jede Staffel ein Abschnitt (F157, Daniel 24.11.2026): `folgen/158871.json` trägt `s` und die Namen als `sn`.
  # `alteKennung`: vom 20. bis 24.11.2026 war jede Staffel ein eigener Titel (7000001–7000003). Daraus leiten sich der Versatz für
  # „gesehen bis“ (`von` − 1) und die Lesart alter Meldungen ab (`pipeline/lib/staffel-altmeldungen.ts`); vergeben wird die Kennung nie wieder.
  # `staffelzaehlung`: in diesem Fenster zählten Meldungen zu 158871 in Staffel 4 (Folge 1 = 137). `von` ist der Tag aus dem Bestand
  # (`staffelTitel.aktiv`), `bis` der Tag, an dem dieser Rückbau live ging (PLATZHALTER: der Dirigent setzt beim Merge den Merge-Tag ein).
  staffelzaehlung: { von: '2026-11-24', bis: '2026-11-25' }
  staffeln:
    - { nr: 1, von: 1, bis: 45, folgen: 45, alteKennung: 7000001, name: "Pokémon Horizonte: Die Serie" }
    - { nr: 2, von: 46, bis: 89, folgen: 44, alteKennung: 7000002, name: "Pokémon Horizonte: Staffel 2 – Die Suche nach Laqua" }
    - { nr: 3, von: 90, bis: 136, folgen: 47, alteKennung: 7000003, name: "Pokémon Horizonte: Staffel 3 – Gute Aussichten" }
    - { nr: 4, von: 137, offen: true, name: "Pokémon Horizonte: Staffel 4 – Wunder in Sicht" }
