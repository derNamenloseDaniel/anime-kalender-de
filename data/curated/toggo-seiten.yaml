# Von Hand zugeordnete TOGGO-Serienseiten (24.11.2026, Auftrag Dirigent): wo der Katalog der TOGGO-Schnittstelle (`data/toggo.json`, `katalog`)
# nicht allein genügt. Die Rechnung steht in `pipeline/lib/toggo-seiten.ts`, der Bau in `pipeline/bau/13-1-toggo-seiten.ts`.
#
# `pokemon`: die 25 deutschen Staffeln der Hauptserie (`data/curated/pokemon-staffeln.yaml`) sind bei TOGGO je eine eigene Serie. Die Zuordnung
# Staffel ↔ Serie ist gemessen, nicht geraten: die Folgen jeder Serie tragen `season_no` = deutsche Staffel (Abruf 24.11.2026,
# `production-n.toggo.de/api/assetstore/vod/asset?filter=type[episode]&filter=series_id[VSE…]`; Staffel 1–25 je genau eine Serie, bei Staffel 16 zwei).
# Folgen je Serie bei TOGGO, S1–S25: 52, 60, 41, 52, 64, 40, 52, 52, 47, 51, 52, 52, 34, 48, 49, 25+20, 48, 45, 48, 43, 48, 54, 48, 42, 54. Unsere Zählung
# (TMDB) weicht bei S1 (82), S2 (36), S5 (65), S10, S18, S19 ab — TOGGO führt nicht jede Folge und schneidet S1/S2 anders; die Staffelnummer stimmt.
# Staffel 16: „Abenteuer in Einal“ (25 Folgen) = 14 + 11 Folgen von 17115 und 14093, „Abenteuer in Einall und darüber hinaus“ (20) = 17873.
#
# `titel`: Titel, bei denen der Name allein nicht reicht (`serie` = `u_name` im Katalog; `beleg` sagt, warum diese Serie).
