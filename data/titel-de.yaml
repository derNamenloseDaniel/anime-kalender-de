# Deutsche Werktitel, von Hand geprüft.
#
# Wofür diese Datei da ist: `titleDe` entsteht sonst aus aniSearchs deutschem
# Sprachblock und aus TMDB. Am 16.09.2026 blieben damit 132 Titel ohne deutschen
# Namen — 57 davon mit belegter deutscher Fassung, die also einen haben.
# Gemessen: aniSearch führt für 54 archivierte Seiten drei deutsche Sprachblöcke
# und keinen einzigen Namen darin; TMDB fällt bei `language=de-DE` still auf den
# Originaltitel zurück (0 echte Übersetzungen in einer Stichprobe von 15).
#
# Kandidaten findet `npx tsx pipeline/fetch-wikidata-titel.ts` über die
# MAL-Kennung; eingetragen wird hier nur, was eine **zweite** Quelle bestätigt.
# Der Grund steht in CLAUDE.md, „Eine Überschrift ist keine Sprachangabe": Ein
# deutscher Name, unter dem niemand sucht, ist schlechter als keiner.
#
# Ein Eintrag hier schlägt jede automatische Quelle.
#
# id      — unsere Titel-Kennung (AniList)
# titleDe — der Name, wie er in Deutschland verwendet wird
# quellen — mindestens zwei, unabhängig voneinander
# geprueftAm — wann nachgesehen wurde

